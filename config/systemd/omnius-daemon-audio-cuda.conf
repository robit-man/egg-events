[Service]
ExecStartPre=/usr/bin/python3 /home/egg/Documents/egg_events/scripts/repair_omnius_audio_runtime.py
# Omnius 1.0.629 otherwise probes the distro Python, which has no CUDA Torch.
# Bootstrap its isolated audio TensorRT venv from Egg's verified JetPack build;
# ensureCudaPythonVenvSync links the vendor Torch into the managed venv.
Environment="OMNIUS_AUDIO_PYTHON=/home/egg/Documents/egg_events/.venv/bin/python"
# JetPack R36.3 tegrastats lacks the --count flag used by Omnius 1.0.629.
Environment="PATH=/home/egg/Documents/egg_events/scripts/compat-bin:/home/egg/.nvm/versions/node/v22.21.0/bin:/home/egg/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
