[Service]
# Discover the newest active NVM bundle at every daemon start. Pinning a Node
# version here leaves a newly auto-updated Omnius process unpatched.
ExecStartPre=/usr/bin/python3 /home/egg/Documents/egg_events/scripts/repair_omnius_asr_runtime.py
Environment="LD_LIBRARY_PATH=/home/egg/.local/opt/egg-ctranslate2-cuda/lib:/usr/local/cuda/targets/aarch64-linux/lib"
Environment="OMNIUS_TRANSCRIBE_PYTHON=/home/egg/.omnius/runtimes/asr/transcribe-cli-node/node_modules/transcribe-cli/.venv/bin/python"
Environment="TRANSCRIBE_PYTHON=/home/egg/.omnius/runtimes/asr/transcribe-cli-node/node_modules/transcribe-cli/.venv/bin/python"
Environment="OMNIUS_ASR_USE_TRANSCRIBE_CLI=1"
