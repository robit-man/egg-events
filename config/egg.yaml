# All physical camera mounts are rotated 90 degrees clockwise before inference.
cameras:
  - id: camera-video1
    source: /dev/video1
    rotation_degrees: 90
  - id: camera-video2
    source: /dev/video2
    rotation_degrees: 90
  - id: camera-video3
    source: /dev/video3
    rotation_degrees: 90
camera_discovery:
  enabled: true
  source_glob: /dev/video*
  fps: 8
  rotation_degrees: 90

vision:
  # YOLOE provides open-vocabulary instance segmentation, not rectangle-only detection.
  detector_model: models/yoloe-11s-seg-pf.pt
  pose_model: models/yolo11n-pose.pt
  clip_model: ViT-B-32
  clip_pretrained: laion2b_s34b_b79k
  device: cuda
  confidence_threshold: 0.45
  sam_model: models/sam2.1_t.pt
  sam_image_size: 640
  sface_model: models/face_recognition_sface_2021dec.onnx
  # Capture stays smooth while GPU inference is rate-limited per camera.
  analysis_fps: 2
  pose_fps: 0.75
  semantic_fps: 0.25
  dashboard_fps: 8
  dashboard_max_width: 960
  max_instances: 24
  minimum_detector_classes: 1000

audio:
  # The runtime resolves this to the physical ReSpeaker array even if desktop
  # routing later changes PulseAudio's default; sounddevice audits use default.
  input_device: default
  output_device: default
  doa_mode: respeaker_usb
  respeaker_vendor_id: 10374
  respeaker_product_id: 24
  # The USB control interface exposes the XVF3000 DSP VAD/DoA/AEC state and
  # drives the 12-pixel ring with the current listen/think/speak floor.
  respeaker_led_enabled: true
  respeaker_led_brightness: 8
  sample_rate: 16000
  channels: 6
  # 6-channel firmware: channel 0 is the ReSpeaker DSP/AEC ASR stream.
  asr_channel: 0
  asr_target_rms: 0.16
  asr_max_gain: 48
  # Keep the AEC microphone live during output so verified heard speech can
  # provisionally stop playback while semantic interruption triage runs.
  barge_in_enabled: true
  playback_resume_rewind_ms: 80
  playback_timeout_seconds: 30
  waveform_fps: 30
  waveform_samples: 256

transcription:
  # segment_seconds is a hard cap on utterance length, not a fixed capture window:
  # utterances are bounded by VAD onset (vad_min_contiguous_ms) and trailing
  # silence (vad_hangover_ms), so speech is never chopped mid-word.
  segment_seconds: 6
  # The DSP channel is quiet by design; post-admission audio is normalized to
  # the target above. WebRTC VAD plus ASR grounding rejects steady ambience.
  rms_threshold: 0.003
  asr_model: dual
  # This installation is used for English conversation and room media. Set to
  # auto live in the dashboard when multilingual recognition is intentional.
  asr_language: en
  # Aggressive mode plus a frame-level floor separates measured fan/chassis
  # ambience from speech without suppressing room-scale speech and podcasts.
  vad_aggressiveness: 3
  vad_input_gain: 8
  vad_min_speech_ms: 240
  vad_min_speech_ratio: 0.15
  vad_min_contiguous_ms: 180
  vad_min_voiced_rms: 0.02
  vad_pre_roll_ms: 300
  vad_hangover_ms: 600
  # Brief answers still close near 600 ms; longer/pause-resumed speech gains a
  # bounded adaptive trailing-silence allowance.
  vad_hangover_max_ms: 1800
  vad_hangover_growth_ms: 1600
  vad_continuation_growth: 1

# Grounded environmental-audio labels run behind the live ASR path. The queue
# coalesces under load so YAMNet/TensorFlow can never delay a spoken turn.
audio_comprehension:
  enabled: true
  queue_size: 1
  minimum_interval_seconds: 15
  minimum_confidence: 0.12
  top_k: 5
  context_ttl_seconds: 90

omnius:
  base_url: http://127.0.0.1:11435
  # JetPack-matched CUDA Whisper container. Omnius still owns conversation and TTS.
  asr_base_url: http://127.0.0.1:11436
  model: omnius-qwen35-9b:latest
  vision_model: robit/ornith-vision:9b
  vision_base_url: http://127.0.0.1:11434
  voice_model: supertonic
  voice_name: F4
  bearer_token_env: EGG_OMNIUS_TOKEN
  timeout_seconds: 120
  reasoning_enabled: false
  dialogue_router_enabled: false

attention:
  max_targets: 1
  track_ttl_seconds: 10
  min_priority: 0.35
  greeting_cooldown_seconds: 45
  proactive_speech_enabled: true
  # Stable face calibration is bounded and independent of generic chatter.
  identity_question_enabled: true
  identity_question_min_sightings: 1
  identity_question_timeout_seconds: 300
  identity_question_cooldown_seconds: 120

identity:
  enabled: true
  storage_dir: data/identity-library
  # CLIP remains a semantic feature, never a durable person identifier.
  similarity_threshold: 0.88
  face_similarity_threshold: 0.45
  face_match_margin: 0.04
  minimum_face_quality: 0.75
  # A single face frame may recall an existing profile, but it cannot mint a
  # durable person. Enrollment requires a stable within-track face sequence.
  enrollment_min_face_observations: 3
  enrollment_face_consistency: 0.65
  # Preserve old source profiles and coalesce only direct high-similarity face
  # matches which were never observed together as distinct people.
  retroactive_coalescing_enabled: true
  retroactive_merge_similarity: 0.80
  track_ttl_seconds: 8
  track_iou_threshold: 0.18
  track_center_distance: 0.65
  # Adjacent instance masks are stronger temporal evidence than detector IDs.
  # A substantially overlapping mask reuses the existing entity even when the
  # bounding box jumps; Ornith then records a visual/displacement audit.
  track_mask_iou_threshold: 0.30
  track_mask_containment_threshold: 0.70
  track_mask_max_gap_seconds: 8
  temporal_vlm_comparison_enabled: true
  temporal_vlm_queue_size: 2
  temporal_vlm_cooldown_seconds: 15
  sample_interval_seconds: 15
  # Retain a compact, pose-diverse gallery instead of destroying all historical
  # angles when the live centroid and latest thumbnail are refreshed.
  gallery_max_samples: 8
  gallery_diversity_similarity: 0.985

dreams:
  enabled: true
  # Pinned, local AdaFace IR18 package. Runtime inference never fetches a model.
  model_path: models/cvlface_adaface_ir18_webface4m
  model_id: minchul/cvlface_adaface_ir18_webface4m
  model_revision: 0dd53f188fa27968b0a1326970ebf4aeb37ce2ca
  # Identity inference stays off the CUDA context shared by Whisper and live
  # vision. IR18 is slower on CPU, but bounded and cannot wedge the live app.
  device: cpu
  batch_size: 64
  use_half_precision: false
  comparison_model_path: ~/.insightface/models/buffalo_s/w600k_mbf.onnx
  comparison_model_id: insightface/buffalo_s-w600k_mbf
  idle_seconds: 45
  # Natural jitter prevents consolidation from becoming another rigid UI-reset interval.
  interval_min_seconds: 600
  interval_max_seconds: 1800
  # When a pass finds aliases, follow up promptly until the gallery converges.
  convergence_interval_seconds: 60
  proposal_similarity: 0.35
  # Template consensus permits dense, multi-angle clusters instead of requiring
  # one fragile exact-nearest-neighbor pair.
  modern_merge_similarity: 0.40
  modern_strong_similarity: 0.54
  legacy_merge_similarity: 0.24
  legacy_strong_similarity: 0.55
  legacy_similarity_floor: 0.12
  comparison_merge_similarity: 0.30
  comparison_strong_similarity: 0.50
  comparison_similarity_floor: 0.15
  minimum_model_votes: 2
  separated_modern_similarity: 0.38
  separated_legacy_floor: 0.15
  mutual_neighbor_margin: 0.025
  reciprocal_neighbor_rank: 8
  # A noisy duplicate in one frame is not a distinct-person veto. Three separate
  # co-observations (or spatially distinct boxes) establish the hard constraint.
  coobservation_min_confirmations: 3
  auto_merge_enabled: true

object_learning:
  enabled: true
  storage_dir: data/object-library
  similarity_threshold: 0.86
  auto_label_enabled: true
  auto_label_confidence_threshold: 0.68
  auto_label_min_confidence: 0.70
  auto_label_cooldown_seconds: 6
  recall_interval_seconds: 0.75
  recall_cache_seconds: 12
  auto_label_max_retries: 2
  auto_label_failure_backoff_seconds: 3
  vlm_max_image_size: 512
  stable_candidate_frames: 3
  speech_priority_seconds: 8
  review_sweep_interval_seconds: 120
  review_stale_after_seconds: 1800
  confidence_audit_enabled: false
  confidence_audit_batch_size: 8

ocr:
  enabled: true
  # Local multi-pass Tesseract remains available when Omnius OCR/VLM services
  # are cold or unhealthy. Omnius refinement is opt-in because it shares the
  # live Ornith model and must never stall the bounded OCR queue.
  local_multipass_enabled: true
  omnius_refinement_enabled: false
  # Full-frame scans catch signs and loose text; text-bearing object crops are
  # prioritized between those scans.
  full_frame_interval_seconds: 20
  text_object_interval_seconds: 8
  queue_size: 8
  max_image_size: 1280
  min_text_characters: 2
  max_fragments: 8

memory:
  enabled: true
  storage_dir: data/cognitive-memory
  migration_mode: dual_write
  retain_raw_media: true
  raw_media_retention_hours: 72
  episode_min_seconds: 1
  episode_max_seconds: 90
  retrieval_limit: 12
  graph_max_hops: 2
  graph_max_nodes: 80
  context_max_characters: 5000
  consolidation_interval_seconds: 300
  consolidation_batch_size: 20

event_segmentation:
  inactivity_seconds: 8
  entity_change_threshold: 0.45
  semantic_change_threshold: 0.45
  doa_change_degrees: 35
  speech_boundary_seconds: 1

cognitive_attention:
  new_entity_weight: 0.35
  action_change_weight: 0.20
  speech_weight: 0.30
  prediction_error_weight: 0.15
  epistemic_value_weight: 0.18
  graph_familiarity_discount: 0.85
  irreducible_uncertainty_discount: 0.65
  interruption_threshold: 0.75
  communicative_action_threshold: 0.35
  proactive_rate_limit_seconds: 90
  uncertainty_question_budget_per_hour: 0

default_mode:
  enabled: true
  idle_seconds: 45
  interval_min_seconds: 60
  interval_max_seconds: 180
  replay_limit: 8
  reflection_min_evidence: 2
  curiosity_threshold: 0.64
  proactive_budget_per_hour: 2
  proactive_cooldown_seconds: 300
  question_timeout_seconds: 240

privacy:
  persistent_identity_enabled: true
  profile_retention_days: 30
  evidence_retention_days: 30
  export_enabled: true
  deletion_enabled: true

runtime:
  event_queue_size: 8
  # Reject overload instead of transcribing stale room audio minutes later.
  speech_queue_size: 1
  reasoning_queue_size: 4
  log_level: INFO
